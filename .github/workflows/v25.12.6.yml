name: v25.12.6

on:
  workflow_dispatch:
  release:
    types: [published]
  schedule:
    - cron: "0 0 * * 0"
  
jobs:
  download-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Building
      run: |
        sudo apt update
        sudo apt install -y build-essential file libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc rsync wget unzip python3 python3-setuptools
        mkdir -p downloads
        cd downloads
        
        wget https://downloads.openwrt.org/releases/25.12.6/targets/ath79/generic/openwrt-imagebuilder-25.12.6-ath79-generic.Linux-x86_64.tar.zst
        
        tar -xf openwrt-imagebuilder-*.tar.zst
        
        cd openwrt-imagebuilder-*/

        make image PROFILE="tplink_tl-wdr6500-v2" PACKAGES="apk-mbedtls base-files ca-bundle dnsmasq dropbear firewall4 fstools kmod-ath9k kmod-gpio-button-hotplug kmod-nft-offload libc libgcc libustream-mbedtls logd mtd netifd nftables odhcp6c odhcpd-ipv6only ppp ppp-mod-pppoe procd-ujail swconfig uboot-envtools uci uclient-fetch urandom-seed urngd wpad-basic-mbedtls kmod-usb-core kmod-usb2 kmod-usb-ledtrig-usbport kmod-ath9k kmod-ath10k-ct ath10k-firmware-qca988x-ct luci luci-app-attendedsysupgrade"
        
    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="v25.12.6"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Uploading files
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          downloads/openwrt-*/bin/targets/ath79/generic/*.bin
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
